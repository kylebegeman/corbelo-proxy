name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tests before release
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for target in \
            "darwin/arm64" \
            "darwin/amd64" \
            "linux/amd64" \
            "linux/arm64" \
            "windows/amd64"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi
            STAGE="dist/corbelo-proxy_${VERSION}_${GOOS}_${GOARCH}"
            mkdir -p "$STAGE"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/kylebegeman/corbelo-proxy/internal/proxy.Version=${VERSION}" \
              -o "${STAGE}/corbelo-proxy${EXT}" \
              ./cmd/corbelo-proxy
            cp LICENSE README.md "$STAGE/"
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip -q -r "corbelo-proxy_${VERSION}_${GOOS}_${GOARCH}.zip" "corbelo-proxy_${VERSION}_${GOOS}_${GOARCH}")
            else
              tar -C dist -czf "dist/corbelo-proxy_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "corbelo-proxy_${VERSION}_${GOOS}_${GOARCH}"
            fi
            rm -rf "$STAGE"
          done
          (cd dist && sha256sum corbelo-proxy_* > checksums.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/corbelo-proxy_*.tar.gz
            dist/corbelo-proxy_*.zip
            dist/checksums.txt

  container:
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
